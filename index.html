{id:"pouletPouletPizza",n:"Pizza maison au poulet",i:[I("pateePizza","Croûtes à pizza","4","boulangerie"),I("poitrines","Poitrines de poulet","1 kg","viande"),I("saucePizza","Sauce à pizza","1","epicerie"),I("mozza","Fromage mozzarella","1 kg","laitier"),I("poivrons","Poivrons","½ sac","legume")],s:["Garnir les croûtes","Four 450 °F, 12 min"]}

const DAYS=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const DEF=["cuissesRoties","spaghetti","thaiPorc","tourtiereSH","lasagne","hotdogs","poutine"];
const STORES=["Maxi","IGA","Metro","Chez Besson","Costco"];
const KEY="epicerie-v1",WEEK="2026-W43";
let S=JSON.parse(localStorage.getItem(KEY)||"null")||{wk:WEEK,menu:DEF.slice(),checked:{},like:{},ban:{},tab:"e"};
// Nouvelle semaine de circulaires : on repart du menu de la semaine, liste et prép décochées (favoris et exclusions conservés)
if(S.wk!==WEEK){S={wk:WEEK,menu:DEF.slice(),checked:{},prep:{},like:S.like||{},ban:S.ban||{},tab:S.tab||"e"}}
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
// Si une ancienne version a laissé un repas inconnu, on revient au menu par défaut pour ce jour
if(!Array.isArray(S.menu)||S.menu.length!==7)S.menu=DEF.slice();
S.menu=S.menu.map((id,d)=>R.some(r=>r.id===id)?id:DEF[d]);S.checked=S.checked||{};S.like=S.like||{};S.ban=S.ban||{};
const byId=id=>R.find(r=>r.id===id);
function list(){const m={};S.menu.forEach(id=>byId(id).i.forEach(x=>{const p=P[x.k],st=p?p[0]:"Maxi";const k=x.k;if(!m[k])m[k]={k,n:x.n,r:x.r,st,pr:p&&p[1],sp:p&&p[2],no:p&&p[3],q:[]};m[k].q.push(x.q)}));return Object.values(m)}
function toast(t){const e=document.getElementById("to");e.textContent=t;e.classList.add("v");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("v"),1600)}
function rE(){const L=list();let h='<button type="button" class="btn main" onclick="shareList()">Partager la liste</button>';
STORES.forEach(st=>{const its=L.filter(x=>x.st===st);if(!its.length&&st!=="Costco"&&st!=="Metro")return;const d=its.filter(x=>S.checked[x.k]).length;
h+=`<section class="card" data-store="${st}"><div class="sh"><h2>${st}</h2><span class="cnt">${d}/${its.length}</span></div><div class="bar"><i style="width:${its.length?d/its.length*100:0}%"></i></div>`;
if(!its.length)h+=`<div class="it"><span class="nm q">${st==='Metro'?'Rien à acheter cette semaine':'Optionnel, rien au menu cette semaine'}</span></div>`;
Object.keys(RY).forEach(r=>{const g=its.filter(x=>x.r===r);if(!g.length)return;h+=`<div class="ry">${RY[r]}</div>`;
g.forEach(x=>{h+=`<div class="it${S.checked[x.k]?" on":""}" onclick="ck('${x.k}')"><span class="ck"></span><span class="nm">${x.n}<br><span class="q">${x.q.join(" + ")}</span></span><span class="pr${x.sp?" sp":""}">${x.pr||""}</span></div>`})});h+="<div style='height:12px'></div></section>"});
const nv=L.filter(x=>!x.pr).map(x=>x.n),nt=L.filter(x=>x.no).map(x=>`<li>${x.n} : ${x.no}</li>`).join("");
h+=`<details><summary>Détails et prix à confirmer</summary><ul><li>Spéciaux valides du jeu. 22 au mer. 28 oct. Tout acheter d’ici mercredi.</li><li>Spaghetti Sans nom 0,99 $ au Maxi : jeudi 22 et vendredi 23 seulement (PC Optimum).</li><li>✿ = prix vu en circulaire (prix Québec, à confirmer en succursale).</li><li>Chez Besson : fermé le dimanche.</li><li>Metro Plus D. Boutin, 99, 8e Avenue.</li><li>Costco : aubaines Québec jusqu'au 25 oct. (pâtés impériaux Minh 9,99 $). Celles du 26 oct. pas encore publiées.</li>${nv.length?`<li>Prix non vérifiés : ${nv.join(", ")}.</li>`:""}${nt}</ul></details>`;
h+='<button type="button" class="btn" onclick="reset()">Tout décocher</button>';return h}
function deals(r){const d=r.i.filter(x=>P[x.k]&&P[x.k][2]);return `<div class="dl">${d.length?"✿ "+d.length+(d.length>1?" spéciaux":" spécial")+" en circulaire":""}</div>`}
function rM(){let h='<div class="note">Portions doublées, les restes font les lunchs ♡</div>';
S.menu.forEach((id,d)=>{const r=byId(id);h+=`<section class="card" data-day="${d}"><div class="day">${DAYS[d]}</div><div class="rt">${r.n}</div>${deals(r)}<ul class="ing">${r.i.map(x=>`<li>${x.n} <span class="q">${x.q}</span>${P[x.k]&&P[x.k][2]?` <span style="color:var(--ac);font-size:11px">✿</span>`:""}</li>`).join("")}</ul><details><summary>Préparation</summary><ol class="st">${r.s.map(x=>`<li>${x}</li>`).join("")}</ol></details>
<div class="acts"><button type="button" class="ch" onclick="chg(${d})">↻ Changer ce repas</button><button type="button" class="lk${S.like[id]?" on":""}" onclick="lk('${id}')" aria-label="Favori">♡</button><button type="button" onclick="ban(${d})" aria-label="Ne plus proposer">✕</button></div></section>`});
const b=Object.keys(S.ban);if(b.length)h+=`<div class="note">Exclues : ${b.map(i=>byId(i).n).join(", ")} · <a href="#" style="color:var(--ac)" onclick="S.ban={};save();draw();return false">tout réactiver</a></div>`;return h}

const MEAT=["cuisses","pilons","poitrines","pouletHache","boeufHache","porcHache","cotelettes","filetPorc","epaulePorc","pouletEntier","saucisses"];
const DA=["lun.","mar.","mer.","jeu.","ven.","sam.","dim."];
function prep(){const use={};S.menu.forEach((id,d)=>byId(id).i.forEach(x=>{(use[x.k]=use[x.k]||{n:x.n,q:[],d:[]});use[x.k].q.push(x.q);if(!use[x.k].d.includes(d))use[x.k].d.push(d)}));
const T=[],has=k=>use[k],days=ks=>[...new Set(ks.flatMap(k=>use[k]?use[k].d:[]))].sort(),add=(id,o,t,min,ks)=>{const d=days(ks);if(d.length)T.push({id,o,t,min,d})};
if(has("epaulePorc"))add("mij",0,"Partir le porc effiloché à la mijoteuse (8 h)",5,["epaulePorc"]);
const tour=S.menu.includes("tourtiere");if(tour)add("tour",1,"Assembler les tourtières et les congeler crues",25,["porcHache"]);
if(has("riz"))add("riz",2,"Cuire tout le riz de la semaine ("+use.riz.q.join(" + ")+"), refroidir, réfrigérer",25,["riz"]);
if(has("patates"))add("pat",3,"Peler et couper les pommes de terre ("+use.patates.q.join(" + ")+"), garder dans l'eau au frigo",15,["patates"]);
["boeufHache","pouletHache"].forEach(k=>{if(!has(k))return;const ds=use[k].d.filter(d=>!(tour&&S.menu[d]==="tourtiere"));if(!ds.length)return;T.push({id:"cuire"+k,o:4,t:"Cuire tout le "+use[k].n.toLowerCase()+" avec un oignon ("+use[k].q.join(" + ")+"), séparer en portions par repas",min:20,d:ds})});
const L=["oignons","poivrons","celeri","carottes","brocoli"].filter(has);if(L.length)add("leg",5,"Couper les légumes : "+L.map(k=>use[k].n.toLowerCase()).join(", ")+" — un contenant par repas",20,L);
const po=["poitrines","cuisses","pilons"].filter(has);if(po.length)add("mar",6,"Couper et mariner/assaisonner le poulet ("+po.map(k=>use[k].n.toLowerCase()).join(", ")+") dans des sacs identifiés par jour",15,po);
const late=MEAT.filter(k=>has(k)&&use[k].d.some(d=>d>=3));if(late.length)T.push({id:"cong",o:7,t:"Portionner et congeler la viande crue pour jeudi à dimanche ("+late.map(k=>use[k].n.toLowerCase()).join(", ")+")",min:10,d:[...new Set(late.flatMap(k=>use[k].d.filter(d=>d>=3)))].sort()});
const early=MEAT.filter(k=>has(k)&&use[k].d.some(d=>d<=1));if(early.length)T.push({id:"dec",o:8,t:"Mettre au frigo (décongeler) la viande de lundi-mardi : "+early.map(k=>use[k].n.toLowerCase()).join(", "),min:2,d:[...new Set(early.flatMap(k=>use[k].d.filter(d=>d<=1)))].sort()});
T.push({id:"etq",o:9,t:"Identifier les contenants (jour + repas) et préparer les plats de dîner",min:5,d:[0,1,2,3,4,5,6]});
return T.sort((a,b)=>a.o-b.o).map(t=>({...t,id:t.id+"|"+S.menu.join(",")}))}
function rP(){S.prep=S.prep||{};const T=prep(),tot=T.reduce((a,t)=>a+t.min,0),d=T.filter(t=>S.prep[t.id]).length;
let h=`<section class="card"><div class="sh"><h2>Dimanche · ~${tot} min</h2><span class="cnt">${d}/${T.length}</span></div><div class="bar"><i style="width:${d/T.length*100}%"></i></div>`;
T.forEach((t,i)=>{h+=`<div class="it${S.prep[t.id]?" on":""}" onclick="pk('${t.id}')"><span class="ck"></span><span class="nm">${i+1}. ${t.t}<br>${t.d.map(x=>`<span class="tag">${DA[x]} ${byId(S.menu[x]).n.split(/[,(]/)[0]}</span>`).join("")}</span><span class="pr">${t.min} min</span></div>`});
h+=`</section><details><summary>Astuces pour économiser</summary><ul>
<li><b>Price match au Maxi</b> : apporter la circulaire d'un concurrent (IGA, Metro) — conditions à vérifier en magasin.</li>
<li><b>Marques maison</b> (Sans nom, Le Choix du Président, Sélection, Compliments) : souvent 20-30 % moins cher.</li>
<li><b>PC Optimum</b> (Maxi) et <b>Moi</b> (Metro) : activer les offres personnalisées avant l'épicerie.</li>
<li><b>Commande en ligne et cueillette</b> : moins d'achats impulsifs avec les enfants.</li>
<li><b>Souper de secours au congélateur</b> (ex. lasagne ou tourtière) pour éviter le resto les soirs rushants.</li>
<li><b>Bœuf haché</b> : 5,44 $/lb en format club au Maxi (rég. 8,49 $) — en prendre plus et congeler en portions de 1 lb.</li>
<li><b>Halloween (sam. 31)</b> : hot-dogs prêts en 15 min avant la tournée des bonbons.</li>
<li><b>Soirées fixes</b> (ex. vendredi poutine, samedi hot-dogs) : moins de décisions, liste plus prévisible.</li></ul></details>`;return h}
function shareText(){const L=list().filter(x=>!S.checked[x.k]);let t="Épicerie 🛒\n";STORES.forEach(st=>{const g=L.filter(x=>x.st===st);if(!g.length)return;t+=`\n${st}\n`+g.map(x=>`○ ${x.n} (${x.q.join(" + ")})${x.pr?" · "+x.pr:""}`).join("\n")+"\n"});return L.length?t.trim():"Tout est coché ✓"}
async function copyT(t,m){try{await navigator.clipboard.writeText(t)}catch(e){}toast(m)}
async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}toast("Liste copiée ♡")}
async function shareList(){const t=shareText();if(navigator.share){try{await navigator.share({title:"Épicerie",text:t});return}catch(e){if(e.name==="AbortError")return}}copy(t)}
const APP_URL="";// URL publique de l'app (à remplir une fois publiée)
async function shareApp(){const u=APP_URL||(/^https?:/.test(location.href)?location.href.split("#")[0]:"");if(u){if(navigator.share){try{await navigator.share({title:"Notre épicerie",url:u});return}catch(e){if(e.name==="AbortError")return}}return copyT(u,"Lien copié ♡")}
const f=new File([SRC],"epicerie.html",{type:"text/html"});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:"Notre épicerie"});return}catch(e){if(e.name==="AbortError")return}}
const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download="epicerie.html";a.click();toast("Fichier téléchargé")}
function pk(k){S.prep=S.prep||{};S.prep[k]=!S.prep[k];save();draw()}
function draw(){document.getElementById("m").innerHTML=S.tab==="e"?rE():S.tab==="p"?rP():rM();document.getElementById("ti").textContent=S.tab==="e"?"Épicerie":S.tab==="p"?"Prép du dimanche":"Menus";t3.classList.toggle("on",S.tab==="p");t1.classList.toggle("on",S.tab==="e");t2.classList.toggle("on",S.tab==="m")}
function tab(t){S.tab=t;save();draw();scrollTo(0,0)}
function ck(k){S.checked[k]=!S.checked[k];save();draw()}
function reset(){if(confirm("Décocher tous les articles?")){S.checked={};save();draw()}}
function chg(d){const pool=R.filter(r=>!S.menu.includes(r.id)&&!S.ban[r.id]);if(!pool.length)return toast("Plus de recettes disponibles");
const fav=pool.filter(r=>S.like[r.id]),src=fav.length&&Math.random()<.5?fav:pool;S.menu[d]=src[Math.floor(Math.random()*src.length)].id;save();draw();toast("Repas changé — liste mise à jour")}
function lk(id){S.like[id]=!S.like[id];save();draw();toast(S.like[id]?"Ajouté aux favoris":"Retiré des favoris")}
function ban(d){S.ban[S.menu[d]]=1;delete S.like[S.menu[d]];chg(d)}
if(location.hash==="#menus")S.tab="m";if(location.hash==="#prep")S.tab="p";if(location.hash==="#epicerie")S.tab="e";
draw();
</script></body></html>
